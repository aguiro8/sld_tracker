<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLD Value</title>
    <link rel="stylesheet" href="styles.css?v=8" />
  </head>
  <body>
    <main class="page-shell value-page">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-brand" href="index.html">Secret Lair Summary</a>
        <div class="site-nav-links">
          <a href="set-finder.html">Set Finder</a>
          <a href="collection.html">Collection</a>
          <a href="sld-value.html" aria-current="page">SLD Value</a>
        </div>
      </nav>

      <header class="page-header value-header">
        <div>
          <p class="eyebrow">Local Mana Value data</p>
          <h1>Secret Lair Value</h1>
          <p class="header-subtitle">Compare each drop against the current value of its individual cards.</p>
        </div>
        <div class="value-header-actions">
          <div class="value-updated" id="updatedAt">Loading local data...</div>
          <button id="refreshDataButton" type="button">Refresh data</button>
        </div>
      </header>

      <section class="value-controls" aria-label="Value controls">
        <label>Price source<select id="provider"><option value="tcg">TCGplayer</option><option value="cm">Cardmarket</option></select></label>
        <label>Price type<select id="priceMode"><option value="market">Market price</option><option value="low">Lowest price</option></select></label>
        <label>Printing<select id="printSource"><option value="any">Cheapest print</option><option value="sld">SLD print</option></select></label>
        <label>Finish<select id="finish"><option value="nonFoil">Non-foil</option><option value="foil">Foil</option></select></label>
        <label class="toggle-label"><input id="includeBonus" type="checkbox" /> Include bonus</label>
        <label class="value-search">Search drops<input id="valueSearch" type="search" placeholder="Search by drop or superdrop" /></label>
        <label>Sort<select id="valueSort"><option value="date">Newest first</option><option value="name">Name</option><option value="value">Highest value</option></select></label>
      </section>

      <section class="value-summary" aria-label="Value summary">
        <div><strong id="dropCount">0</strong><span>drops shown</span></div>
        <div><strong id="cardCount">0</strong><span>cards represented</span></div>
        <div><strong id="totalValue">$0.00</strong><span>combined value</span></div>
      </section>

      <section class="value-table-card">
        <div class="value-table-head"><strong>Secret Lair drops</strong><span id="statusMessage">Loading...</span></div>
        <div class="table-wrap">
          <table class="value-table">
            <thead><tr><th>Drop</th><th>Date</th><th>Cards</th><th>Non-foil</th><th>Foil</th><th>Value</th></tr></thead>
            <tbody id="valueRows"></tbody>
          </table>
        </div>
      </section>

    </main>

    <div id="valueModal" class="value-modal hidden" role="dialog" aria-modal="true" aria-labelledby="dropDetailsTitle">
      <div class="value-modal-panel">
        <button id="closeValueModal" class="value-modal-close" type="button" aria-label="Close drop details">Close</button>
        <section id="dropDetails" class="drop-details" aria-live="polite"></section>
      </div>
    </div>

    <script>
      (() => {
        const state = { data: null, selectedDrop: null };
        const provider = document.getElementById("provider");
        const priceMode = document.getElementById("priceMode");
        const printSource = document.getElementById("printSource");
        const finish = document.getElementById("finish");
        const includeBonus = document.getElementById("includeBonus");
        const valueSearch = document.getElementById("valueSearch");
        const valueSort = document.getElementById("valueSort");
        const valueRows = document.getElementById("valueRows");
        const dropDetails = document.getElementById("dropDetails");
        const valueModal = document.getElementById("valueModal");
        const closeValueModal = document.getElementById("closeValueModal");
        const refreshDataButton = document.getElementById("refreshDataButton");

        const money = value => Number.isFinite(Number(value)) ? `$${Number(value).toFixed(2)}` : "N/A";
        const selectedTotal = drop => {
          const totals = includeBonus.checked ? drop.combinedTotals : drop.totals;
          return totals?.[provider.value]?.[printSource.value]?.[priceMode.value]?.[finish.value] ?? null;
        };
        const selectedCardPrice = card => card.prices?.[provider.value]?.[printSource.value]?.[priceMode.value]?.[finish.value] ?? null;

        function render() {
          if (!state.data) return;
          let drops = state.data.lairs.filter(drop => {
            const query = valueSearch.value.trim().toLowerCase();
            return !query || `${drop.name} ${drop.superdrop || ""}`.toLowerCase().includes(query);
          });
          drops.sort((left, right) => {
            if (valueSort.value === "name") return left.name.localeCompare(right.name);
            if (valueSort.value === "value") return (selectedTotal(right) || -1) - (selectedTotal(left) || -1);
            return String(right.releasedAt || "").localeCompare(String(left.releasedAt || ""));
          });

          const totalValue = drops.reduce((sum, drop) => sum + (selectedTotal(drop) || 0), 0);
          const cardCount = drops.reduce((sum, drop) => sum + (drop.cards?.length || 0), 0);
          document.getElementById("dropCount").textContent = drops.length.toLocaleString();
          document.getElementById("cardCount").textContent = cardCount.toLocaleString();
          document.getElementById("totalValue").textContent = money(totalValue);
          document.getElementById("statusMessage").textContent = `${drops.length.toLocaleString()} of ${state.data.lairs.length.toLocaleString()} drops`;
          valueRows.innerHTML = "";

          drops.forEach(drop => {
            const row = document.createElement("tr");
            row.className = "value-row";
            row.tabIndex = 0;
            row.innerHTML = `<td><strong>${drop.name}</strong><small>${drop.superdrop || ""}</small></td><td>${drop.releasedAt || "N/A"}</td><td>${drop.cards?.length || 0}</td><td>${money(drop.totals?.[provider.value]?.[printSource.value]?.[priceMode.value]?.nonFoil)}</td><td>${money(drop.totals?.[provider.value]?.[printSource.value]?.[priceMode.value]?.foil)}</td><td><strong>${money(selectedTotal(drop))}</strong></td>`;
            const open = () => showDetails(drop);
            row.addEventListener("click", open);
            row.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); open(); } });
            valueRows.appendChild(row);
          });
        }

        function showDetails(drop) {
          state.selectedDrop = drop;
          valueModal.classList.remove("hidden");
          dropDetails.innerHTML = `<div class="drop-details-head"><div><p class="eyebrow">${drop.superdrop || "Secret Lair"}</p><h2 id="dropDetailsTitle">${drop.name}</h2><p>${drop.releasedAt || "Release date unavailable"} · ${drop.cards?.length || 0} cards</p></div><strong>${money(selectedTotal(drop))}</strong></div><div class="card-value-grid"></div>`;
          const grid = dropDetails.querySelector(".card-value-grid");
          (drop.cards || []).forEach(card => {
            const item = document.createElement("article");
            item.className = "card-value-item";
            item.innerHTML = `<img src="${card.imageUrl || ""}" alt="${card.name}" loading="lazy"><div><strong>${card.name}</strong><span>${money(selectedCardPrice(card))}</span></div>`;
            grid.appendChild(item);
          });
        }


        function extractLiveData(html) {
          const pushes = [...html.matchAll(/self\.__next_f\.push\(\[1,"([\s\S]*?)"\]\)<\/script>/g)];
          let decoded = "";

          for (const match of pushes) {
            try {
              const value = JSON.parse(`"${match[1]}"`);
              if (value.includes('"tab":"secret-lair"')) {
                decoded = value;
              }
            } catch {
              continue;
            }
          }

          const marker = '{"tab":"secret-lair","lairs":';
          const start = decoded.indexOf(marker);
          if (start < 0) throw new Error("Live Secret Lair data was not found.");

          let depth = 0;
          let inString = false;
          let escaped = false;
          let end = -1;
          for (let index = start; index < decoded.length; index += 1) {
            const character = decoded[index];
            if (inString) {
              if (escaped) escaped = false;
              else if (character === "\\") escaped = true;
              else if (character === '"') inString = false;
              continue;
            }
            if (character === '"') inString = true;
            else if (character === "{") depth += 1;
            else if (character === "}") {
              depth -= 1;
              if (depth === 0) { end = index + 1; break; }
            }
          }

          if (end < 0) throw new Error("Live Secret Lair data was incomplete.");
          return JSON.parse(decoded.slice(start, end));
        }

        async function refreshLiveData() {
          refreshDataButton.disabled = true;
          refreshDataButton.textContent = "Refreshing...";
          document.getElementById("statusMessage").textContent = "Fetching Mana Value data...";
          try {
            const response = await fetch("https://www.manavalue.org/", { cache: "no-store" });
            if (!response.ok) throw new Error(`Mana Value returned HTTP ${response.status}.`);
            state.data = extractLiveData(await response.text());
            document.getElementById("updatedAt").textContent = `Live data refreshed ${new Date().toLocaleString()}`;
            render();
          } catch (error) {
            document.getElementById("statusMessage").textContent = error.message;
          } finally {
            refreshDataButton.disabled = false;
            refreshDataButton.textContent = "Refresh data";
          }
        }
        function closeModal() {
          valueModal.classList.add("hidden");
        refreshDataButton.addEventListener("click", refreshLiveData);
          state.selectedDrop = null;
        }

        [provider, priceMode, printSource, finish, includeBonus, valueSearch, valueSort].forEach(control => control.addEventListener("input", render));
        closeValueModal.addEventListener("click", closeModal);
        valueModal.addEventListener("click", event => {
          if (event.target === valueModal) closeModal();
        });
        document.addEventListener("keydown", event => {
          if (event.key === "Escape" && !valueModal.classList.contains("hidden")) closeModal();
        });
        fetch("sld-value-data.json", { cache: "no-store" }).then(response => {
          if (!response.ok) throw new Error(`Data file unavailable (${response.status})`);
          return response.json();
        }).then(data => {
          state.data = data;
          document.getElementById("updatedAt").textContent = `Data refreshed ${data.updatedAt || "locally"}`;
          render();
        }).catch(error => {
          document.getElementById("statusMessage").textContent = error.message;
        });
      })();
    </script>
  </body>
</html>
