<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLD Collection</title>

    <link rel="stylesheet" href="styles.css?v=6" />
    <link rel="icon" type="image/png" href="logo.png" />
  </head>

  <body>
    <main class="page-shell">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-brand" href="index.html" aria-current="page">Secret Lair Summary</a>
        <div class="site-nav-links">
          <a href="set-finder.html">Set Finder</a>
          <a href="collection.html">Collection</a>
          <a href="sld-value.html">SLD Value</a>
          <a href="secret-value.html">Secret Value</a>
        </div>
      </nav>
      <header class="page-header">
        <div>
          <h1>Secret Lair Summary</h1>
        </div>

        <div class="controls">
          <button id="refreshButton" type="button">
            Reload local CSV
          </button>
        </div>
      </header>

      <section class="results-card">
        <div class="summary-row">
          <div class="summary-stat">
            <strong>Total market value</strong>
            <div id="totalValue" class="summary-total">$0.00</div>
          </div>

          <div class="summary-stat">
            <strong>Total items</strong>
            <div id="summaryCount" class="summary-total">0</div>
          </div>

          <div class="summary-stat hidden" id="unmatchedRowsStat">
            <strong>Unmatched rows</strong>
            <div id="unmatchedRows" class="summary-total">0</div>
          </div>
        </div>

        <div class="table-toolbar">
          <div>
            <strong id="resultCount">0 items</strong>
          </div>

          <div id="statusMessage" class="status-message">
            Loading CSV…
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>
                  <button
                    type="button"
                    class="sort-button"
                    data-sort-key="name"
                  >
                    Name
                    <span class="sort-indicator">↕</span>
                  </button>
                </th>

                <th>
                  <button
                    type="button"
                    class="sort-button"
                    data-sort-key="initialPrice"
                  >
                    Initial Price
                    <span class="sort-indicator">↕</span>
                  </button>
                </th>

                <th>
                  <button
                    type="button"
                    class="sort-button"
                    data-sort-key="market"
                  >
                    Market
                    <span class="sort-indicator">↕</span>
                  </button>
                </th>

                <th>
                  <button
                    type="button"
                    class="sort-button"
                    data-sort-key="netChange"
                  >
                    Net Change
                    <span class="sort-indicator">↕</span>
                  </button>
                </th>

                <th>
                  <button
                    type="button"
                    class="sort-button"
                    data-sort-key="quantity"
                  >
                    Qty
                    <span class="sort-indicator">↕</span>
                  </button>
                </th>

                <th>
                  <button
                    type="button"
                    class="sort-button"
                    data-sort-key="tcgplayer_id"
                  >
                    TCGPlayer
                    <span class="sort-indicator">↕</span>
                  </button>
                </th>
              </tr>
            </thead>

            <tbody id="resultsBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js?v=3"></script>
  </body>
</html>
