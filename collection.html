<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collection Explorer</title>
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>

  <body>
    <main class="page-shell">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="site-brand" href="index.html">Secret Lair Summary</a>
        <div class="site-nav-links">
          <a href="set-finder.html">Set Finder</a>
          <a href="collection.html" aria-current="page">Collection</a>
        </div>
      </nav>

      <header class="page-header">
        <div>
          <h1>Collection Explorer</h1>
          <div id="collectionHeadline" class="header-subtitle">Loading collection…</div>
        </div>

        <div class="controls">
          <input id="collectionSearch" class="toolbar-input" type="search" placeholder="Search cards…" aria-label="Search cards" />

          <select id="purchaseSort" class="toolbar-select" aria-label="Sort by purchase price">
            <option value="desc">Purchase price ↓</option>
            <option value="asc">Purchase price ↑</option>
          </select>

          <button id="refreshCollectionButton" type="button">Reload CSV</button>
        </div>
      </header>

      <section class="results-card">
        <div class="summary-row">
          <div class="summary-stat">
            <strong>Decks &amp; binders</strong>
            <div id="binderCount" class="summary-total">0</div>
          </div>

          <div class="summary-stat">
            <strong>Selected cards</strong>
            <div id="selectedCount" class="summary-total">0</div>
          </div>          
          <div class="summary-stat">
            <strong>Total market value</strong>
            <div id="marketTotal" class="summary-total">$0.00</div>
          </div>
        </div>

        <div class="table-toolbar">
          <div id="resultSummary">0 cards</div>
          <div id="collectionStatus" class="status-message">Loading CSV…</div>
        </div>

        <div class="binder-toolbar">
          <button id="allCollectionsTab" type="button" class="binder-tab active">All collections <span class="count">0</span></button>
          <div class="collection-groups">
            <div class="collection-group">
              <h3>Decks</h3>
              <div id="deckTabs" class="binder-tabs" aria-label="Deck selection"></div>
            </div>
            <div class="collection-group">
              <h3>Binders</h3>
              <div id="binderTabs" class="binder-tabs" aria-label="Binder selection"></div>
            </div>
          </div>
        </div>

        <div id="paginationTop" class="pagination" aria-label="Pagination"></div>

        <div id="cardGrid" class="card-grid" aria-live="polite"></div>

        <div id="paginationBottom" class="pagination" aria-label="Pagination"></div>
      </section>
    </main>

    <script>
      (() => {
        const PAGE_SIZE = 100;
        const DB_NAME = "mtg-set-finder";
        const DB_VERSION = 4;
        const CARD_STORE = "cards";
        const META_STORE = "meta";
        const CACHE_META_KEY = "activeBulkCache";

        let dbPromise = null;
        let allRows = [];
        let deckMap = new Map();
        let binderMap = new Map();
        let selectedBinder = "all";
        let selectedCollectionType = "all";
        let currentPage = 1;
        let purchaseSortDirection = "desc";
        let marketTotalRequest = 0;

        const binderTabs = document.getElementById("binderTabs");
        const cardGrid = document.getElementById("cardGrid");
        const resultSummary = document.getElementById("resultSummary");
        const binderCount = document.getElementById("binderCount");
        const selectedCount = document.getElementById("selectedCount");
        const marketTotal = document.getElementById("marketTotal");
        const collectionStatus = document.getElementById("collectionStatus");
        const collectionHeadline = document.getElementById("collectionHeadline");
        const paginationTop = document.getElementById("paginationTop");
        const paginationBottom = document.getElementById("paginationBottom");
        const refreshButton = document.getElementById("refreshCollectionButton");
        const collectionSearch = document.getElementById("collectionSearch");
        const purchaseSort = document.getElementById("purchaseSort");
        const allCollectionsTab = document.getElementById("allCollectionsTab");
        const deckTabs = document.getElementById("deckTabs");

        function normalizeCardName(value) {
          return String(value || "")
            .normalize("NFKC")
            .trim()
            .toLowerCase();
        }

        function parseCsvLine(line) {
          const values = [];
          let current = "";
          let inQuotes = false;

          for (let i = 0; i < line.length; i += 1) {
            const char = line[i];
            const next = line[i + 1];

            if (char === '"') {
              if (inQuotes && next === '"') {
                current += '"';
                i += 1;
              } else {
                inQuotes = !inQuotes;
              }
            } else if (char === "," && !inQuotes) {
              values.push(current.trim());
              current = "";
            } else {
              current += char;
            }
          }

          values.push(current.trim());
          return values;
        }

        function parseCsv(csvText) {
          const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== "");

          if (lines.length < 2) {
            return [];
          }

          const headers = parseCsvLine(lines[0]);

          return lines.slice(1).map(line => {
            const values = parseCsvLine(line);
            const entry = {};

            headers.forEach((header, index) => {
              entry[header] = values[index] || "";
            });

            return entry;
          });
        }

        function openDatabase() {
          if (dbPromise) {
            return dbPromise;
          }

          dbPromise = new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);

            request.onerror = () => reject(request.error);

            request.onupgradeneeded = event => {
              const db = event.target.result;

              if (db.objectStoreNames.contains(CARD_STORE)) {
                db.deleteObjectStore(CARD_STORE);
              }

              const cardStore = db.createObjectStore(CARD_STORE, { keyPath: "key" });
              cardStore.createIndex("cacheName", ["cacheId", "nameNorm"], { unique: false });
              cardStore.createIndex("cacheId", "cacheId", { unique: false });

              if (!db.objectStoreNames.contains(META_STORE)) {
                db.createObjectStore(META_STORE, { keyPath: "key" });
              }
            };

            request.onsuccess = () => resolve(request.result);
          });

          return dbPromise;
        }

        async function idbGetMeta(key) {
          const db = await openDatabase();

          return new Promise((resolve, reject) => {
            const tx = db.transaction(META_STORE, "readonly");
            const request = tx.objectStore(META_STORE).get(key);

            request.onsuccess = () => resolve(request.result || null);
            request.onerror = () => reject(request.error);
          });
        }

        async function idbPutMeta(value) {
          const db = await openDatabase();

          return new Promise((resolve, reject) => {
            const tx = db.transaction(META_STORE, "readwrite");
            tx.objectStore(META_STORE).put(value);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        }

        async function putCardBatch(cards) {
          if (!cards || cards.length === 0) {
            return;
          }

          const db = await openDatabase();

          return new Promise((resolve, reject) => {
            const tx = db.transaction(CARD_STORE, "readwrite");
            const store = tx.objectStore(CARD_STORE);

            for (const card of cards) {
              store.put(card);
            }

            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        }

        async function getCardsByName(cacheId, cardName) {
          const db = await openDatabase();
          const normalized = normalizeCardName(cardName);

          return new Promise((resolve, reject) => {
            const tx = db.transaction(CARD_STORE, "readonly");
            const index = tx.objectStore(CARD_STORE).index("cacheName");
            const request = index.getAll(IDBKeyRange.only([cacheId, normalized]));

            request.onsuccess = () => resolve(request.result || []);
            request.onerror = () => reject(request.error);
          });
        }

        function getCardLookupNames(card) {
          const names = new Set();
          if (card && card.name) {
            names.add(card.name.trim());
          }

          if (Array.isArray(card?.card_faces)) {
            for (const face of card.card_faces) {
              if (face?.name) {
                names.add(face.name.trim());
              }
            }
          }

          if (card?.name?.includes("//")) {
            for (const part of card.name.split("//")) {
              const trimmed = part.trim();
              if (trimmed) {
                names.add(trimmed);
              }
            }
          }

          return [...names].filter(Boolean);
        }

        function getImageUris(card) {
          if (card && card.image_uris) {
            return card.image_uris;
          }

          if (card && Array.isArray(card.card_faces)) {
            for (const face of card.card_faces) {
              if (face && face.image_uris) {
                return face.image_uris;
              }
            }
          }

          return {};
        }

        function compactBulkCard(card, cacheId) {
          if (!card || !card.id || !card.name || !card.set) {
            return [];
          }

          const images = getImageUris(card);
          const lookupNames = getCardLookupNames(card);

          return lookupNames.map(lookupName => {
            const nameNorm = normalizeCardName(lookupName);
            return {
              key: `${cacheId}:${card.id}:${nameNorm}`,
              cacheId,
              id: card.id,
              name: card.name,
              lookupName,
              nameNorm,
              set: card.set,
              setName: card.set_name || card.set,
              setType: card.set_type || "",
              games: Array.isArray(card.games) ? card.games : [],
              digital: Boolean(card.digital),
              promo: Boolean(card.promo),
              prices: {
                usd: card.prices?.usd ?? null,
                usdFoil: card.prices?.usd_foil ?? null,
                usdEtched: card.prices?.usd_etched ?? null,
              },
              finishes: card.finishes || [],
              collectorNumber: card.collector_number || "",
              rarity: card.rarity || "",
              releasedAt: card.released_at || "",
              scryfallUri: card.scryfall_uri || "",
              imageSmall: images.small || images.thumb || "",
              imageNormal: images.normal || images.grid || images.small || images.thumb || "",
            };
          });
        }

        async function refreshBulkDatabase() {
          const metaResponse = await fetch("https://api.scryfall.com/bulk-data/default_cards");
          if (!metaResponse.ok) {
            throw new Error(`Unable to retrieve Scryfall bulk metadata (${metaResponse.status}).`);
          }

          const bulkMeta = await metaResponse.json();
          const downloadUri = bulkMeta.jsonl_download_uri || bulkMeta.download_uri;
          if (!downloadUri) {
            throw new Error("Scryfall did not return a bulk download URI.");
          }

          const cacheId = [bulkMeta.id, bulkMeta.updated_at].filter(Boolean).join("|");

          collectionStatus.textContent = "Downloading local Scryfall database…";

          const response = await fetch(downloadUri);
          if (!response.ok) {
            throw new Error(`Bulk download failed (${response.status}).`);
          }

          if (!response.body || typeof DecompressionStream === "undefined") {
            throw new Error("This browser cannot stream the Scryfall database.");
          }

          const compressedStream = response.body.pipeThrough(new DecompressionStream("gzip"));
          const reader = compressedStream.getReader();
          const decoder = new TextDecoder();
          let textBuffer = "";
          let batch = [];
          let importedCards = 0;

          while (true) {
            const { done, value } = await reader.read();
            if (done) {
              break;
            }
            textBuffer += decoder.decode(value, { stream: true });

            let newlineIndex;
            while ((newlineIndex = textBuffer.indexOf("\n")) !== -1) {
              const line = textBuffer.slice(0, newlineIndex).trim();
              textBuffer = textBuffer.slice(newlineIndex + 1);
              if (!line) {
                continue;
              }

              try {
                const card = JSON.parse(line);
                const compactRecords = compactBulkCard(card, cacheId);
                if (compactRecords.length > 0) {
                  batch.push(...compactRecords);
                }
              } catch (error) {
                console.warn("Skipping malformed bulk-data line.", error);
              }

              if (batch.length >= 750) {
                await putCardBatch(batch);
                importedCards += batch.length;
                batch = [];
                collectionStatus.textContent = `Indexing local Scryfall data… ${importedCards.toLocaleString()} printings`;
              }
            }
          }

          if (textBuffer.trim()) {
            try {
              const card = JSON.parse(textBuffer.trim());
              const compactRecords = compactBulkCard(card, cacheId);
              if (compactRecords.length > 0) {
                batch.push(...compactRecords);
              }
            } catch (error) {
              console.warn("Unable to parse final bulk-data line.", error);
            }
          }

          if (batch.length > 0) {
            await putCardBatch(batch);
            importedCards += batch.length;
          }

          await idbPutMeta({
            key: CACHE_META_KEY,
            cacheId,
            bulkId: bulkMeta.id,
            updatedAt: bulkMeta.updated_at,
            importedAt: new Date().toISOString(),
            cardCount: importedCards,
            downloadUri,
          });

          collectionStatus.textContent = `Local Scryfall cache ready: ${importedCards.toLocaleString()} printings.`;
          return;
        }

        async function ensureBulkDatabase() {
          const meta = await idbGetMeta(CACHE_META_KEY).catch(() => null);
          if (meta && meta.cacheId) {
            return meta;
          }

          await refreshBulkDatabase();
          const refreshed = await idbGetMeta(CACHE_META_KEY).catch(() => null);
          if (!refreshed || !refreshed.cacheId) {
            throw new Error("The local Scryfall database could not be created.");
          }
          return refreshed;
        }

        function buildBinderMap(rows, collectionType) {
          const map = new Map();

          for (const row of rows) {
            const rowType = String(row["Binder Type"] || "binder").trim().toLowerCase() === "deck" ? "deck" : "binder";
            if (rowType !== collectionType) {
              continue;
            }

            const binderName = (row["Binder Name"] || "Unassigned").trim() || "Unassigned";
            if (!map.has(binderName)) {
              map.set(binderName, []);
            }
            map.get(binderName).push(row);
          }

          return new Map([...map.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, { sensitivity: "base" })));
        }

        function getPurchasePrice(row) {
          const raw = String(row["Purchase price"] || "").trim();
          if (!raw) {
            return 0;
          }

          const numeric = Number.parseFloat(raw.replace(/[^0-9.-]/g, ""));
          return Number.isFinite(numeric) ? numeric : 0;
        }

        function getSelectedRows() {
          const selectedMap = selectedCollectionType === "deck" ? deckMap : binderMap;
          let rows = selectedCollectionType === "all" ? allRows : (selectedMap.get(selectedBinder) || []);

          const searchValue = normalizeCardName(collectionSearch.value || "");
          if (searchValue) {
            rows = rows.filter(row => {
              const haystack = [
                row["Name"],
                row["Set code"],
                row["Set name"],
                row["Binder Name"],
                row["Rarity"],
                row["Foil"],
                row["Collector number"]
              ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

              return haystack.includes(searchValue);
            });
          }

          rows = [...rows].sort((left, right) => {
            const leftPrice = getPurchasePrice(left);
            const rightPrice = getPurchasePrice(right);
            const difference = leftPrice - rightPrice;
            return purchaseSortDirection === "asc" ? difference : -difference;
          });

          return rows;
        }

        async function updateMarketTotal(rows) {
          const requestId = ++marketTotalRequest;
          marketTotal.textContent = "Calculating…";

          const details = await Promise.all(rows.map(row => resolveCardDetails(row)));
          if (requestId !== marketTotalRequest) {
            return;
          }

          const total = details.reduce((sum, detail, index) => {
            const quantity = Number.parseFloat(rows[index].Quantity) || 1;
            return sum + (detail.marketPrice || 0) * quantity;
          }, 0);

          marketTotal.textContent = `$${total.toFixed(2)}`;
        }

        function renderPagination(totalCards) {
          const totalPages = Math.max(1, Math.ceil(totalCards / PAGE_SIZE));
          currentPage = Math.min(currentPage, totalPages);

          const createPageButton = (page, label, isSelected, isDisabled) => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            button.className = "page-button" + (isSelected ? " current" : "");
            button.disabled = isDisabled;
            button.addEventListener("click", () => {
              currentPage = page;
              renderCollection();
            });
            return button;
          };

          const renderInto = container => {
            container.innerHTML = "";

            if (totalCards <= PAGE_SIZE) {
              return;
            }

            const prevButton = createPageButton(Math.max(1, currentPage - 1), "Prev", false, currentPage === 1);
            container.appendChild(prevButton);

            const first = Math.max(1, currentPage - 2);
            const last = Math.min(totalPages, currentPage + 2);

            for (let page = first; page <= last; page += 1) {
              const button = createPageButton(page, String(page), page === currentPage, false);
              container.appendChild(button);
            }

            const nextButton = createPageButton(Math.min(totalPages, currentPage + 1), "Next", false, currentPage === totalPages);
            container.appendChild(nextButton);
          };

          renderInto(paginationTop);
          renderInto(paginationBottom);
        }

        function renderBinderTabs() {
          const renderGroup = (container, collectionMap, collectionType) => {
            container.innerHTML = "";

            for (const [collectionName, rows] of collectionMap.entries()) {
              const button = document.createElement("button");
              button.type = "button";
              button.className = "binder-tab" + (selectedCollectionType === collectionType && selectedBinder === collectionName ? " active" : "");
              button.innerHTML = `${collectionName} <span class="count">${rows.length}</span>`;
              button.addEventListener("click", () => {
                selectedCollectionType = collectionType;
                selectedBinder = collectionName;
                currentPage = 1;
                renderCollection();
              });
              container.appendChild(button);
            }
          };

          allCollectionsTab.className = "binder-tab" + (selectedCollectionType === "all" ? " active" : "");
          allCollectionsTab.innerHTML = `All collections <span class="count">${allRows.length}</span>`;
          allCollectionsTab.onclick = () => {
            selectedCollectionType = "all";
            selectedBinder = "all";
            currentPage = 1;
            renderCollection();
          };

          renderGroup(deckTabs, deckMap, "deck");
          renderGroup(binderTabs, binderMap, "binder");
        }

        function getMarketPrice(printing, row) {
          if (!printing || !printing.prices) {
            return null;
          }

          const isFoil = String(row.Foil || "").trim().toLowerCase() === "foil";
          const rawPrice = isFoil
            ? (printing.prices.usdFoil ?? printing.prices.usd)
            : printing.prices.usd;
          const price = Number.parseFloat(rawPrice);

          return Number.isFinite(price) ? price : null;
        }

        async function resolveCardDetails(row) {
          const directId = String(row["Scryfall ID"] || "").trim();
          const cardName = String(row["Name"] || "").trim();

          if (!cardName && !directId) {
            return { image: "", marketPrice: null };
          }

          const meta = await idbGetMeta(CACHE_META_KEY).catch(() => null);

          if (meta && meta.cacheId) {
            const printings = await getCardsByName(meta.cacheId, cardName).catch(() => []);
            const normalizedName = normalizeCardName(cardName);
            const matchingPrinting = printings.find(printing => {
              if (directId && String(printing.id || "").toLowerCase() === directId.toLowerCase()) {
                return true;
              }

              const setCode = String(row["Set code"] || "").trim().toLowerCase();
              const collector = String(row["Collector number"] || "").trim();
              const matchesSet = String(printing.set || "").trim().toLowerCase() === setCode;
              const matchesCollector = !collector || String(printing.collectorNumber || "").trim() === collector;
              const matchesName = normalizeCardName(printing.name || "") === normalizedName || normalizeCardName(printing.lookupName || "") === normalizedName;
              return matchesSet && matchesCollector && matchesName;
            });

            const image = matchingPrinting ? matchingPrinting.imageNormal || matchingPrinting.imageSmall || "" : "";
            const marketPrice = getMarketPrice(matchingPrinting, row);

            if (image || marketPrice !== null) {
              return { image, marketPrice };
            }
          }

          if (directId) {
            return { image: `https://cards.scryfall.io/normal/front/${directId}.jpg`, marketPrice: null };
          }

          return { image: "", marketPrice: null };
        }

        function buildCardTile(row, cardDetails) {
          const tile = document.createElement("article");
          tile.className = "card-tile";

          const imageWrap = document.createElement("div");
          imageWrap.className = "card-image-wrap";

          if (cardDetails.image) {
            const image = document.createElement("img");
            image.alt = row["Name"] || "Card";
            image.loading = "lazy";
            image.src = cardDetails.image;
            image.onerror = () => {
              imageWrap.innerHTML = '<div class="no-image">Image unavailable</div>';
            };
            imageWrap.appendChild(image);
          } else {
            const placeholder = document.createElement("div");
            placeholder.className = "no-image";
            placeholder.textContent = "No image available";
            imageWrap.appendChild(placeholder);
          }

          const body = document.createElement("div");
          body.className = "card-body";

          const name = document.createElement("div");
          name.className = "card-name";
          name.textContent = row["Name"] || "Unknown card";

          const meta = document.createElement("div");
          meta.className = "card-meta";
          const setLabel = row["Set code"] ? row["Set code"] : "Unknown set";
          const collector = row["Collector number"] ? ` #${row["Collector number"]}` : "";
          meta.textContent = `${setLabel}${collector}`;

          const footer = document.createElement("div");
          footer.className = "card-footer";

          const quantityPill = document.createElement("span");
          quantityPill.className = "pill";
          quantityPill.textContent = `Qty ${row.Quantity || 1}`;

          const foilTag = document.createElement("span");
          foilTag.textContent = String(row.Foil || "").toLowerCase() === "foil" ? "Foil" : "Normal";

          const priceTag = document.createElement("span");
          priceTag.className = "market-price";
          priceTag.textContent = cardDetails.marketPrice === null
            ? "Market N/A"
            : `Market $${cardDetails.marketPrice.toFixed(2)}`;

          footer.appendChild(quantityPill);
          footer.appendChild(foilTag);
          footer.appendChild(priceTag);

          body.appendChild(name);
          body.appendChild(meta);
          body.appendChild(footer);

          tile.appendChild(imageWrap);
          tile.appendChild(body);

          return tile;
        }

        function renderCollection() {
          const rows = getSelectedRows();
          const totalCards = rows.length;

          renderBinderTabs();
          renderPagination(totalCards);

          const start = (currentPage - 1) * PAGE_SIZE;
          const pageRows = rows.slice(start, start + PAGE_SIZE);

          resultSummary.textContent = `${totalCards.toLocaleString()} card${totalCards === 1 ? "" : "s"}`;
          selectedCount.textContent = totalCards.toLocaleString();
          binderCount.textContent = (deckMap.size + binderMap.size).toLocaleString();
          updateMarketTotal(rows).catch(() => {
            marketTotal.textContent = "Market N/A";
          });

          if (selectedCollectionType === "all") {
            collectionHeadline.textContent = `Viewing all collections · ${totalCards.toLocaleString()} cards`;
          } else {
            const collectionLabel = selectedCollectionType === "deck" ? "Deck" : "Binder";
            collectionHeadline.textContent = `${collectionLabel}: ${selectedBinder} · ${totalCards.toLocaleString()} cards`;
          }

          cardGrid.innerHTML = "";

          if (pageRows.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-state";
            empty.textContent = "No cards match the selected collection.";
            cardGrid.appendChild(empty);
            return;
          }

          const loadingText = document.createElement("div");
          loadingText.className = "empty-state";
          loadingText.textContent = "Loading card images…";
          cardGrid.appendChild(loadingText);

          const tilePromises = pageRows.map(async row => {
            const cardDetails = await resolveCardDetails(row);
            return buildCardTile(row, cardDetails);
          });

          Promise.all(tilePromises).then(tiles => {
            cardGrid.innerHTML = "";
            tiles.forEach(tile => cardGrid.appendChild(tile));
            collectionStatus.textContent = `Showing ${start + 1}-${Math.min(start + pageRows.length, totalCards)} of ${totalCards}`;
          }).catch(() => {
            cardGrid.innerHTML = "";
            pageRows.forEach(row => {
              cardGrid.appendChild(buildCardTile(row, { image: "", marketPrice: null }));
            });
            collectionStatus.textContent = "Loaded collection with placeholder image fallbacks.";
          });
        }

        async function loadCollectionCsv() {
          collectionStatus.textContent = "Loading CSV…";

          try {
            const response = await fetch("ManaBox_Collection.csv", { cache: "no-store" });

            if (!response.ok) {
              throw new Error(`Unable to load ManaBox_Collection.csv (${response.status})`);
            }

            const csvText = await response.text();
            const rows = parseCsv(csvText);

            allRows = rows.filter(row => String(row["Binder Name"] || "").trim());
            deckMap = buildBinderMap(allRows, "deck");
            binderMap = buildBinderMap(allRows, "binder");

            if (allRows.length === 0) {
              throw new Error("No rows were found in the collection CSV.");
            }

            try {
              await ensureBulkDatabase();
            } catch (error) {
              console.warn("Unable to load local Scryfall cache.", error);
              collectionStatus.textContent = "Local Scryfall cache unavailable; using Scryfall fallback URLs for card art.";
            }

            selectedBinder = "all";
            selectedCollectionType = "all";
            currentPage = 1;
            renderCollection();
            collectionStatus.textContent = `Loaded ${allRows.length.toLocaleString()} cards across ${(deckMap.size + binderMap.size).toLocaleString()} decks and binders.`;
          } catch (error) {
            console.error(error);
            collectionStatus.textContent = `CSV load failed: ${error.message}`;
            cardGrid.innerHTML = `<div class="empty-state">The collection CSV could not be loaded. Open this page from the project directory or make sure ManaBox_Collection.csv is present.</div>`;
          }
        }

        refreshButton.addEventListener("click", () => {
          currentPage = 1;
          loadCollectionCsv();
        });

        collectionSearch.addEventListener("input", () => {
          currentPage = 1;
          renderCollection();
        });

        purchaseSort.addEventListener("change", () => {
          purchaseSortDirection = purchaseSort.value;
          currentPage = 1;
          renderCollection();
        });

        document.addEventListener("DOMContentLoaded", () => {
          loadCollectionCsv();
        });
      })();
    </script>
  </body>
</html>
